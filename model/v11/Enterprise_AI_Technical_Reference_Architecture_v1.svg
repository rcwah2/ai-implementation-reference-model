<rect fill="#e0f1e8" height="48" rx="12" stroke="#92aec7" stroke-width="2" width="730" x="795" y="728"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="20" font-weight="bold" x="813" y="759">Tools and enterprise applications</text>
