<text fill="#23364c" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="838" y="226">Human oversight</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="838" y="254">Consequential approvals • escalation • stop authority</text>
