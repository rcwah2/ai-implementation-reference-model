<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="50" y="87">CONCEPTUAL REFERENCE • v1.0 • Aligned with Enterprise Architecture sheet, Implementation Model v11</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="50" y="119">Companion to the management and governance diagram • Component placement and agent use are conditional</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="27" font-weight="bold" x="50" y="167">1  Logical architecture — responsibilities independent of hosting</text>
