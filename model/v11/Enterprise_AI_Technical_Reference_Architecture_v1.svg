<text fill="#23364c" font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="1268.0" y="509.5">Proposed action</text>
<rect fill="#fff7e8" height="100" rx="12" stroke="#ceb47b" stroke-width="2" width="1500" x="50" y="837"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="68" y="868">Data and state ownership boundary</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="896">Data/state services: authoritative business records | workflow state/checkpoints | memory, retrieval and caches</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="921">Named owners • authorized access • freshness • concurrency • reconciliation • retention</text>
<path d="M1160 795 L1160 837" fill="none" marker-end="url(#arrow)" stroke="#476079" stroke-width="2.2"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="16" font-weight="normal" x="1168.0" y="808.0">Record access</text>
<rect fill="#233f59" height="102" rx="12" stroke="#233f59" stroke-width="2" width="1500" x="50" y="969"/>
<text fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="68" y="1000">Agent Control Plane — cross-cutting controls</text>
<text fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="1028">Identity • authorization • policy enforcement • monitoring • audit • recovery • independent containment</text>
<text fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="1053">Applies at every component and handoff; correlate business task, identities, delegation, approvals and outcomes.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="50" y="1103">Boundary boxes indicate trust/authority changes, not prescribed network segments. Arrows are representative interactions.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="50" y="1130">Delegation cannot expand authority. Every receiving service verifies caller, scope, action and resource; model output is not permission.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="27" font-weight="bold" x="50" y="1180">2  Deployment options — same logical components, different approved placement</text>
<rect fill="#edf4fa" height="248" rx="12" stroke="#92aec7" stroke-width="2" width="450" x="50" y="1212"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="68" y="1243">A  One approved environment</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="1271">Workflows and human oversight</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="1296">Orchestration and agents</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="1321">Models, tools and applications</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="1346">Data/state services</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="1371">Local enforcement and telemetry</text>
<rect fill="#f7fafc" height="248" rx="12" stroke="#92aec7" stroke-width="2" width="1015" x="535" y="1212"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="553" y="1243">B  Across approved environments</text>
<rect fill="#edf4fa" height="82" rx="12" stroke="#92aec7" stroke-width="2" width="465" x="555" y="1268"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="573" y="1299">Enterprise</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="573" y="1327">Workflows • apps • authoritative records</text>
<rect fill="#edf4fa" height="82" rx="12" stroke="#92aec7" stroke-width="2" width="480" x="1050" y="1268"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="1068" y="1299">Cloud</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="1068" y="1327">Agents • models • approved data/state</text>
<rect fill="#edf4fa" height="72" rx="12" stroke="#92aec7" stroke-width="2" width="465" x="555" y="1370"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="573" y="1401">Edge</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="573" y="1429">Local execution • bounded offline scope</text>
<rect fill="#edf4fa" height="72" rx="12" stroke="#92aec7" stroke-width="2" width="480" x="1050" y="1370"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="21" font-weight="bold" x="1068" y="1401">Third party</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="1068" y="1429">Approved models • APIs • services</text>
<path d="M1020 1308 L1050 1308" fill="none" marker-end="url(#arrow)" stroke="#476079" stroke-width="2.2"/>
<path d="M785 1350 L785 1370" fill="none" marker-end="url(#arrow)" stroke="#476079" stroke-width="2.2"/>
<path d="M1290 1350 L1290 1370" fill="none" marker-end="url(#arrow)" stroke="#476079" stroke-width="2.2"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="50" y="1496">Across boundaries: versioned contracts • approved service discovery • receiving-service authorization • trace correlation</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="50" y="1527">In every environment: policy enforcement • local containment • safe recovery • named service and state owners</text>
<rect fill="#edf4fa" height="73" rx="12" stroke="#92aec7" stroke-width="2" width="1500" x="50" y="1550"/>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="23" font-weight="bold" x="68" y="1581">Distributed deployment does not automatically mean decentralized governance.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="18" font-weight="normal" x="68" y="1609">Hosting, governance structure and agent authority are independent decisions. Multiple agents may run in one environment.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="24" font-weight="bold" x="50" y="1662">Lifecycle and architectural evolution</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="50" y="1693">Phase 0: business justification, constraints, authority boundaries, dependencies and ownership; record open decisions.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="50" y="1723">Gates 2–3: design and approve architecture/authority. Gates 4–5: implement controls and telemetry.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="50" y="1753">Gates 6–8: test end-to-end failures, confirm readiness and authorize production. Operations: reassess material changes.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="50" y="1783">Evolution: modular services, interface compatibility, state migration, transition prerequisites and rollback.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="19" font-weight="normal" x="50" y="1813">Containment: timeouts, bounded retries, duplicate prevention, cancellation and uncertain-result reconciliation; fail closed.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="50" y="1850">Workbook alignment: T035–T045 • T244/T254 • T333/T344 • T391/T396 • T431. Technical expansion of layers 5–7.</text>
<text fill="#23364c" font-family="Arial, sans-serif" font-size="17" font-weight="normal" x="50" y="1877">Assumptions: vendor-neutral; tailor by use case and risk; edge, agents and third parties are optional; no fixed hosting topology.</text>
</svg>